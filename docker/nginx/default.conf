# Единая точка входа:
#   /api, /admin, Livewire, Filament  -> PHP-FPM (Laravel)
#   всё остальное                      -> Next.js (витрина)
# Сайт и API на одном домене — CORS не нужен.

upstream php {
    server app:9000;
}

upstream web {
    server web:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 200m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Статика Filament и логотипы админки из образа nginx
    location ~ ^/((css|js|fonts)/filament|admin-assets)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Laravel
    location ~ ^/(api|admin|filament|sanctum|storage|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    # Livewire использует префикс с хэшем: /livewire-xxxxxxxx/update
    location ~ ^/livewire-[a-z0-9]+/ {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        internal;
        fastcgi_pass php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    # Next.js: неизменяемые бандлы кэшируем надолго
    location /_next/static/ {
        proxy_pass http://web;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next стримит HTML (Suspense) — не буферизуем.
        proxy_buffering off;
    }
}
