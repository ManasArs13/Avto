name: avto

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avto
      POSTGRES_USER: avto
      POSTGRES_PASSWORD: avto
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avto -d avto"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: avto-dev-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7701:7700"
    volumes:
      - meilidata:/meili_data

volumes:
  pgdata:
  redisdata:
  meilidata:
